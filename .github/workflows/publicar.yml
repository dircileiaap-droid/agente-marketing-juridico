name: Publicar no Instagram

on:
  schedule:
    # Confere a fila a cada hora (no minuto 7, fora da hora cheia, quando o GitHub atrasa
    # menos). Cada post só sai quando o SEU horário já passou: feed 21h, Stories 14h ou o
    # "horario" do post ("10h", "18h"), no horário de Brasília. Sem post no horário, a
    # execução termina sem publicar nada.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      simular:
        description: "Só simular (não publica)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: repositorio
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Publicar posts do dia
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_URL: ${{ vars.IG_GRAPH_URL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python main.py publicar ${{ inputs.simular && '--simular' || '' }}

      - name: Registrar publicação no repositório
        run: |
          git config user.name "agente-marketing"
          git config user.email "agente-marketing@users.noreply.github.com"
          git add posts/
          git diff --cached --quiet || (git commit -m "Post publicado no Instagram" && git pull --rebase && git push)
