name: Publicar no Instagram

on:
  schedule:
    # Segunda, quarta e sexta às 21h (Brasília) = terça, quinta e sábado 00h (UTC).
    # O GitHub pode atrasar alguns minutos em horários de pico.
    - cron: "0 0 * * 2,4,6"
    # Stories: sábado às 14h (Brasília) = sábado 17h (UTC).
    - cron: "0 17 * * 6"
  workflow_dispatch:
    inputs:
      simular:
        description: "Só simular (não publica)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: repositorio
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Publicar posts do dia
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_URL: ${{ vars.IG_GRAPH_URL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python main.py publicar ${{ inputs.simular && '--simular' || '' }}

      - name: Registrar publicação no repositório
        run: |
          git config user.name "agente-marketing"
          git config user.email "agente-marketing@users.noreply.github.com"
          git add posts/
          git diff --cached --quiet || (git commit -m "Post publicado no Instagram" && git pull --rebase && git push)
